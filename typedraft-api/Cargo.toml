[package]
name = "typedraft-api"
version = "0.1.0"
edition = "2024"
description = "TypeDraft API server for AI-powered document generation"

[dependencies]
# Typst core
typst = { workspace = true }
typst-pdf = { workspace = true }
typst-assets = { workspace = true }
typst-syntax = { workspace = true }
